# Sky Task service - Cloud Run settings (no secrets here). Paths are relative to this file (/app/service).
[cloud]
store = "cloud"                                  # tasks from Firestore `tasks` + strips from the private bucket
project = "sky-task-c4048"
bucket = "sky-task-c4048-masters"

[local]
generator_data_dir = "../data"                   # unused with store = "cloud"
service_db = "/tmp/skytask_service.sqlite3"      # live sessions/challenges only; answers also go to Firestore
static_dir = "../explorer"
widget_dir = "../widget"

[serving]
challenge_ttl_s = 600
pool_refresh_s = 60       # re-read Firestore for new/retired tasks every minute
science_share = 0.5
recheck_rate = 0.05

[http]
# Any site may embed the widget (no cookies or credentials are used; site keys decide what a site may ask for).
cors_origins = ["*"]

[site_keys.demo]
max_count = 10
modes = ["none", "score", "token"]

[site_keys.demo-game]
max_count = 10
modes = ["none", "score", "token"]

[site_keys.inspector]
max_count = 10
modes = ["none", "score", "token"]
